server {
    listen 80;

    # Frontend Static Files
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Backend Proxy Logic
    location /api/ {
        # Use Docker's embedded DNS resolver so upstream is resolved per-request
        # (not at nginx startup), which avoids "host not found" when backend
        # container hasn't registered yet.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend "backend:8000";
        proxy_pass http://$backend;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Important for streaming results
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }
}